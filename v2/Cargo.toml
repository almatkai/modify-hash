[package]
name = "modify-hash-v2"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust", rev = "e955911f0bf5b558f9d3eb5183df0adc95c22af2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
cap-std = "=3.4.5"
cap-fs-ext = "=3.4.5"
md5 = "=0.7.0"
flate2 = "1"
crc32fast = "1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2", "flate2"] }
uuid = { version = "=1.23.3", features = ["v4"] }


[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
cap-primitives = "=3.4.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
